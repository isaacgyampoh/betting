<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GameClaw</title>
    <!--
      This is not the app. The app is loaded from gameclaw.win, so that a web deploy is an app
      update and the two can never drift. This is the screen for the one case the server cannot be
      asked about: the device has no network at all.

      It retries by itself, so a user who walks back into signal does not have to work out that
      they should pull down or reopen anything.
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #111113;
        color: #fafafa;
        font: 400 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 22rem; text-align: center; }
      .mark {
        width: 56px; height: 56px; margin: 0 auto 20px;
        border-radius: 14px; background: #2346b5;
        display: grid; place-items: center;
      }
      .mark span { display: block; width: 4px; height: 20px; background: #fff; border-radius: 2px; transform: skewX(-12deg); }
      .mark div { display: flex; gap: 4px; }
      h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px; }
      p { margin: 0 0 24px; color: #a1a1aa; font-size: 0.9375rem; }
      button {
        font: inherit; font-weight: 600;
        background: #2346b5; color: #fff; border: 0;
        padding: 12px 24px; border-radius: 10px; min-height: 48px; min-width: 140px;
      }
      button:active { opacity: 0.85; }
      .state { margin-top: 16px; font-size: 0.8125rem; color: #71717a; min-height: 1.25rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><div><span></span><span></span><span></span></div></div>
      <h1>No connection</h1>
      <p>GameClaw needs the internet for live scores and prices. Nothing here is ever shown as current when it isn't.</p>
      <button id="retry" type="button">Try again</button>
      <p class="state" id="state" role="status" aria-live="polite"></p>
    </main>

    <script>
      const SITE = "https://gameclaw.win";
      const state = document.getElementById("state");
      const button = document.getElementById("retry");
      let checking = false;

      async function online() {
        // A HEAD to our own origin, not navigator.onLine: a phone on wifi with no route out
        // reports itself online, and then the app loads nothing.
        try {
          await fetch(SITE + "/api/v1/health", { method: "HEAD", cache: "no-store", signal: AbortSignal.timeout(6000) });
          return true;
        } catch {
          return false;
        }
      }

      async function attempt(manual) {
        if (checking) return;
        checking = true;
        if (manual) state.textContent = "Checking…";
        if (await online()) {
          state.textContent = "Back online, opening GameClaw…";
          location.replace(SITE);
          return;
        }
        if (manual) state.textContent = "Still no connection.";
        checking = false;
      }

      button.addEventListener("click", () => attempt(true));
      addEventListener("online", () => attempt(false));
      // Keep trying quietly, so walking back into signal is enough on its own.
      setInterval(() => attempt(false), 5000);
      attempt(false);
    </script>
  </body>
</html>
