# Render blueprint for the GameClaw API and admin dashboard.
#
# Create everything from this file: Render dashboard -> New -> Blueprint -> pick this repo.
# Render reads this, shows you exactly what it will create and what it costs, and you approve it
# there. Nothing is created by running it locally.
#
# Deliberately NOT in here: the Cloudflare Workers, gameclaw.win, or anything touching the
# marketing site. This file describes the API and its database and nothing else.
#
# Region is Frankfurt, not the Oregon the other projects in this workspace use. The users are in
# Ghana and the database it replaces is in eu-west-1; Oregon would add a transatlantic round trip
# to every query. The database and the service must share a region for private networking.

databases:
  - name: gameclaw-db
    # $6/month. The free plan expires 30 days after creation, so it is not an option for a
    # production database - it is a trial with a deletion date.
    plan: basic-256mb
    region: frankfurt
    # Production is on 17.6 today. Matching the major version means the dump restores without
    # a version jump in the middle of a migration.
    postgresMajorVersion: "17"
    databaseName: gameclaw
    user: gameclaw

services:
  - type: web
    name: gameclaw-api
    runtime: node
    # $7/month. The free plan spins down when idle, and the first request afterwards waits tens
    # of seconds. The warm match centre is 0.65s; a cold start would be the slowest thing in the
    # product by two orders of magnitude.
    plan: starter
    region: frankfurt
    # Read from the live service, not assumed: `GET /v1/services/srv-db9nfr4s728c73cbbjvg`
    # reports `branch: render`. This file said `main` for months while every deploy came from
    # `render`, which is how a deployed commit ended up being one that did not exist on main at
    # all - and why a merge to main looked like it should ship something and did not.
    #
    # `main` is kept identical anyway (render is fast-forwarded into it and both are pushed), so
    # the two cannot drift, but this line now says what the service actually does.
    branch: render

    # **Deploys are manual.** Pushing changes nothing: the commit sits on GitHub until somebody
    # triggers a deploy from the dashboard or the API. This is declared rather than left to the
    # default because its absence reads as "autoDeploy is on", and a push that silently does
    # nothing looks exactly like a deploy that failed. See docs/deployment-and-rollback.md.
    autoDeploy: false
    # db:generate explicitly, not as a side effect of postinstall. With a warm pnpm store the
    # install is a no-op and its scripts are skipped, so lib/generated/prisma never appears and
    # the build dies on module-not-found - which only happens on the second deploy onward, when
    # there is a cache to reuse.
    # `corepack enable` on its own stopped working: Render's image ships pnpm at /usr/bin/pnpm
    # and mounts /usr/bin read-only, so corepack dies trying to replace it with its own shim -
    # `EROFS: read-only file system, unlink '/usr/bin/pnpm'` - before a single dependency is
    # fetched. Installing the shims somewhere writable and putting that first on PATH keeps the
    # pnpm version pinned by `packageManager` without touching the system copy. The mkdir is not
    # optional: corepack lstats the directory before writing and exits ENOENT if it is absent.
    buildCommand: mkdir -p "$HOME/.corepack-bin" && corepack enable --install-directory "$HOME/.corepack-bin" && export PATH="$HOME/.corepack-bin:$PATH" && pnpm install --frozen-lockfile && pnpm db:generate && pnpm build
    # Migrations run here, as part of the deploy, over Render's private network.
    #
    # They used to run in GitHub Actions, which cannot reach the private network and so connected
    # to the database's **public** hostname with secrets.DIRECT_URL. That is the only reason
    # `gameclaw-db` needs to accept connections from the internet at all - and by default it accepts
    # them from everywhere, which it still does: a bare TCP connect to
    # dpg-db9n7d7btjjs73cbok6g-a.frankfurt-postgres.render.com:5432 from an arbitrary machine is
    # answered, and the server offers TLS. Credentials are still required, so this is exposure
    # rather than compromise, but port 5432 is open to every host on the internet.
    #
    # A pre-deploy command closes that gap without any new infrastructure. It runs after
    # buildCommand and before startCommand, in this service's own environment and region, so
    # DIRECT_URL below resolves to the database's internal hostname and the connection never leaves
    # Render's network. It is Render's documented recommendation for migrations, and Prisma's.
    #
    # It fails safe, which is the reason to prefer it to a start-command migration: if it fails or
    # times out (30 minutes) the deploy fails, later steps do not run, and the service keeps serving
    # its last successful deploy with zero downtime. It also runs once per deploy rather than once
    # per instance, so two instances cannot race the same migration.
    #
    # The binary directly, not `pnpm db:migrate`: buildCommand installs corepack shims into
    # $HOME/.corepack-bin and puts them on PATH for its own shell only, and the pre-deploy command
    # runs on a separate instance that does not inherit that PATH. Calling node_modules/.bin/prisma
    # needs no package manager and fails loudly if the dependency is missing rather than silently
    # fetching a different version the way `npx` would.
    #
    # Cost: pre-deploy commands draw on the same build pipeline minutes the buildCommand already
    # uses (500/month included, then $5 per 1,000). `prisma migrate deploy` with nothing pending
    # takes seconds, and deploys here are manual, so this adds no new charge and no new service.
    preDeployCommand: node_modules/.bin/prisma migrate deploy

    startCommand: pnpm start
    healthCheckPath: /api/v1/health
    envVars:
      # Wired by Render from the database above, so no credential is typed anywhere.
      - key: DATABASE_URL
        fromDatabase:
          name: gameclaw-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: gameclaw-db
          property: connectionString

      # Generated once by Render and never shown to anybody. This signs our own access tokens;
      # see lib/identity/session.ts.
      - key: AUTH_JWT_SECRET
        generateValue: true

      # Not a secret: it ships inside the APK. It is the audience every Google ID token is
      # checked against, so it must match the client id the Flutter build was given.
      #
      # Comma-separated, newest first, because the id is baked into each installed APK and the
      # server has to keep accepting builds already in the field. The release build signs in with
      # b4oh5at..., which is the id actually present in the signed APK; k5ikq1qt... is kept for
      # anything built before the switch. Removing an id here rejects every APK still carrying it,
      # so ids come off this list only once no install can be sending them.
      - key: GOOGLE_WEB_CLIENT_ID
        value: 400646694915-b4oh5athe842emcnga4913s1oq1igjh1.apps.googleusercontent.com,400646694915-k5ikq1qt4mjcrctfpckebuq24qlbttqo.apps.googleusercontent.com

      - key: NODE_VERSION
        value: "24"
      - key: STATS_MODE
        value: auto
      - key: SPORTYBET_MODE
        value: live
      - key: MSPORT_MODE
        value: live
      - key: FOOTBALLCOM_MODE
        value: live
      - key: BETWAY_MODE
        value: mock
      # Production never serves sample bookmaker data; an unconnected bookmaker refuses instead.
      - key: ALLOW_SAMPLE_DATA
        value: "0"

      # Set by hand in the Render dashboard, not here. A blueprint is committed to the
      # repository, so anything with a real value in it is a secret in version control.
      #   API_FOOTBALL_KEY
      #   ANTHROPIC_API_KEY
      #   PAYSTACK_SECRET_KEY
      #   IP_HASH_SALT
      #   CRON_SECRET
      #   FCM_SERVICE_ACCOUNT
      # NEXT_PUBLIC_SITE_URL must be set to this service's own URL once Render has assigned it.
      - key: API_FOOTBALL_KEY
        sync: false
      # GOAL API, the second stats source added after the 2026-11-01 quota outage. Set by hand in
      # the dashboard like every other secret. With it present the application prefers it over
      # API-Football; see lib/services/stats.ts for why only one provider answers at a time.
      - key: GOAL_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
        sync: false
      - key: IP_HASH_SALT
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: FCM_SERVICE_ACCOUNT
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
